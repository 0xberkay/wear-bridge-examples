name: release-apks
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.EXAMPLES_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/examples-release.jks"
          chmod 600 "$RUNNER_TEMP/examples-release.jks"
      - name: Build signed APKs
        env:
          EXAMPLES_KEYSTORE_FILE: ${{ runner.temp }}/examples-release.jks
          EXAMPLES_KEYSTORE_PASSWORD: ${{ secrets.EXAMPLES_KEYSTORE_PASSWORD }}
          EXAMPLES_KEY_ALIAS: ${{ secrets.EXAMPLES_KEY_ALIAS }}
          EXAMPLES_KEY_PASSWORD: ${{ secrets.EXAMPLES_KEY_PASSWORD }}
        run: ./gradlew assembleRelease test --parallel
      - run: |
          mkdir -p dist
          cp examples/wear-perm-list/build/outputs/apk/release/*-release.apk dist/wear-perm-list-release.apk
          cp examples/wear-dpi-switcher/build/outputs/apk/release/*-release.apk dist/wear-dpi-switcher-release.apk
          cp examples/wear-custom-animator/build/outputs/apk/release/*-release.apk dist/wear-custom-animator-release.apk
          ls -la dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*-release.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
